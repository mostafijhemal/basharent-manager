name: Build Signed BashaRent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Generate Ephemeral Signing Keystore (if no secret provided)
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias basharent \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass BashaRentReleaseKey2026 \
              -keypass BashaRentReleaseKey2026 \
              -dname "CN=BashaRent Manager, OU=Property, O=BashaRent, L=Dhaka, S=Dhaka, C=BD"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'BashaRentReleaseKey2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'basharent' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'BashaRentReleaseKey2026' }}
        run: gradle assembleRelease

      - name: Upload Installable Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BashaRentManager-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
